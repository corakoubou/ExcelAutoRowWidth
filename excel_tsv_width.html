<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel 列幅 TSV 生成</title><style>*{box-sizing:border-box}body{background:#171a21;color:#e5e9f0;font:15px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:24px}section{background:#222731;border:1px solid #394150;border-radius:12px;padding:18px;margin:14px 0}h1{font-size:25px}h2{font-size:17px;margin-top:0}textarea,input,select,button{font:inherit;color:inherit;background:#151922;border:1px solid #495466;border-radius:6px;padding:9px}textarea{width:100%;min-height:110px}button{cursor:pointer;background:#365d9c}button:hover{background:#4777bd}[hidden]{display:none!important}label{display:inline-flex;flex-direction:column;gap:5px;margin:6px}input[type=number]{width:100px}#paste{border:2px dashed #7188aa;padding:24px;text-align:center;border-radius:8px;outline:none}#paste:focus{border-color:#8ebaff}small,#status{color:#aebed4}table{border-collapse:collapse;width:100%}td,th{padding:6px;border:1px solid #495466;text-align:left}#preview{overflow:auto;padding:10px 0}#preview table{width:auto;table-layout:fixed;background:#fff;color:#222}#preview td{padding:0;height:25px;border:1px solid #c8c8c8;white-space:nowrap}#preview th{background:#d9e2f3;border:1px solid #222;padding:0 2px;white-space:nowrap;overflow:hidden;font-weight:normal}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto}details{margin-top:12px}.buttons{display:flex;gap:8px;flex-wrap:wrap}</style><main><h1>Excel 列幅 TSV 生成ツール</h1><section><h2>1. Excelの列幅を取得</h2><div id="paste" tabindex="0">Excelでセル範囲をコピー → ここをクリックして Ctrl+V</div><p id="status">未取得：手入力でも生成できます。</p><details><summary>取得したクリップボード情報</summary><pre id="raw"></pre></details></section><section><h2>2. 項目と設定</h2>
<label>入力モード<select id="input-mode">
<option value="headers">項目列のみモード</option>
<option value="tsv">項目列＆行データモード（TSV）</option>
</select></label>
<textarea id="items" aria-label="項目名" placeholder="項目名を1行ずつ貼り付け">No
Simei
SimeiKana
ZyuusyoToDenwaBangou</textarea>
<div id="tsv-input" hidden>
<small id="tsv-help">サンプルデータ作成ツールの C# 変数モードで出力した TSV を貼り付けてください。先頭行を項目名、2行目以降をデータとして読み込みます。</small>
<textarea id="tsv" aria-label="項目名と行データ（TSV）" aria-describedby="tsv-help tsv-status" spellcheck="false"></textarea>
<p id="tsv-status" role="status"></p>
</div><div><label>フォント<input id="font" value="游ゴシック"></label><label>サイズ (pt)<input id="size" type="number" min="1" max="100" value="11"></label><label>基本列幅 (px)<input id="width" type="number" min="1" max="1000" value="30"></label><label>余白 (px)<input id="pad" type="number" min="0" max="500" value="6"></label><label>最小セル数<input id="minimum" type="number" min="1" max="100" value="3"></label><label id="blank-row-setting">データ行数<input id="rows" type="number" min="0" max="100" value="6"></label><label>列幅の使用<select id="mode"><option value="uniform">基本列幅で統一</option><option value="actual">取得した列幅を順番に使用</option></select></label><label>太字<input id="bold" type="checkbox"></label></div></section><section><h2>3. プレビュー</h2><div id="preview"></div><table><thead><tr><th>項目</th><th>文字＋余白 (px)</th><th>セル数</th><th>確保幅 (px)</th></tr></thead><tbody id="stats"></tbody></table></section><section><h2>4. 出力</h2><div class="buttons"><button id="copy">TSVをコピー</button><button id="htmlcopy">結合・罫線付き表をコピー（試験機能）</button><button id="save">TSV保存</button></div><p id="msg" role="status"></p><textarea id="out" readonly></textarea><small>TSVは空白セルをタブで表現します。セル結合・罫線はHTMLコピーのみ。Excel側の貼り付け結果は環境によって異なります。</small></section></main><script>
const $=id=>document.getElementById(id), ctx=document.createElement('canvas').getContext('2d');let widths=[],html='';const num=(id,min,max)=>Math.max(min,Math.min(max,Number($(id).value)||min));const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function px(v){if(!v)return NaN;let n=parseFloat(v);return /pt$/i.test(v)?n*96/72:/^(\d+(\.\d+)?)(px)?$/i.test(v)?n:NaN}function styleVal(el,key){return el?.style?.getPropertyValue(key)||''}
$('paste').addEventListener('paste',e=>{e.preventDefault();let h=e.clipboardData.getData('text/html'),t=e.clipboardData.getData('text/plain');$('raw').textContent=h||t||'情報なし';widths=[];if(!h){$('status').textContent='HTML情報なし。列幅を手入力してください。';render();return}let d=new DOMParser().parseFromString(h,'text/html'),table=d.querySelector('table');if(!table){$('status').textContent='表を検出できませんでした。';render();return}for(let c of table.querySelectorAll('col')){let w=px(styleVal(c,'width')||c.getAttribute('width'));let span=Math.min(1000,Number(c.getAttribute('span'))||1);for(let i=0;i<span;i++)widths.push(w)}if(!widths.length){let r=[...table.rows].find(r=>[...r.cells].every(c=>c.colSpan===1));if(r)widths=[...r.cells].map(c=>px(styleVal(c,'width')||c.getAttribute('width')))}if(widths.some(w=>!Number.isFinite(w)||w<=0))widths=[];let cell=table.querySelector('td,th'),rules=[...d.querySelectorAll('style')].map(s=>s.textContent).join('\n');let css=document.createElement('div').style;for(let m of rules.matchAll(/([^{}]+)\{([^{}]+)\}/g)){try{if(cell&&cell.matches(m[1].trim()))css.cssText+=';'+m[2]}catch{}}let f=styleVal(cell,'font-family')||css.fontFamily||cell?.querySelector('font')?.getAttribute('face');let s=styleVal(cell,'font-size')||css.fontSize;if(f)$('font').value=f.replace(/["']/g,'').split(',')[0];if(s&&Number.isFinite(px(s)))$('size').value=+(px(s)*.75).toFixed(2);if(widths.length){$('width').value=+widths[0].toFixed(2);$('mode').value='actual'}else $('mode').value='uniform';$('status').textContent=`列幅: ${widths.length?widths.map(w=>w.toFixed(1)).join(', ')+' px':'取得不可（手入力）'} ／ フォント: ${f||'取得不可'} ／ サイズ: ${s||'取得不可'}`;render()});
function readTsv(value) {
  const text = value.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').replace(/\n$/, '');
  if (!text) return {names: [], rows: [], message: 'TSVを貼り付けてください。'};

  const [header, ...lines] = text.split('\n');
  if (!header.trim()) return {names: [], rows: [], message: '先頭行に項目名を入力してください。'};

  const names = header.split('\t');
  const rows = lines.map(line => line.split('\t'));
  const extraColumn = rows.findIndex(row => row.length > names.length);
  if (extraColumn !== -1) {
    return {names: [], rows: [], message: `${extraColumn + 2}行目の列数がヘッダーの列数（${names.length}）を超えています。`};
  }
  return {names, rows, message: `${names.length}列・${rows.length}データ行を読み込みました。`};
}

function render() {
  const useTsv = $('input-mode').value === 'tsv';
  $('items').hidden = useTsv;
  $('tsv-input').hidden = !useTsv;
  $('blank-row-setting').hidden = useTsv;

  const {names, rows, message} = useTsv ? readTsv($('tsv').value) : {
    names: $('items').value.split(/\r?\n|\t/).map(name => name.trim()).filter(Boolean).slice(0, 500),
    rows: Array.from({length: Math.floor(num('rows', 0, 100))}, () => [])
  };
  $('tsv-status').textContent = message ?? '';
  for (const id of ['copy', 'htmlcopy', 'save']) $(id).disabled = useTsv && !names.length;

  const font = $('font').value || 'sans-serif';
  const size = num('size', 1, 100);
  const base = num('width', 1, 1000);
  const pad = num('pad', 0, 500);
  const min = Math.ceil(num('minimum', 1, 100));
  const bold = $('bold').checked;

  ctx.font = `${bold ? 'bold ' : ''}${size}pt ${JSON.stringify(font)}`;
  const contentWidths = names.map(name => ctx.measureText(name).width);
  if (useTsv) {
    ctx.font = `${size}pt ${JSON.stringify(font)}`;
    for (const row of rows) {
      row.forEach((value, i) => {
        if (value) contentWidths[i] = Math.max(contentWidths[i], ctx.measureText(value).width);
      });
    }
  }

  const columnWidths = [];
  const useActualWidths = $('mode').value === 'actual';
  const columns = names.map((name, i) => {
    const need = contentWidths[i] + pad;
    let width = 0;
    let span = 0;
    while ((width < need || span < min) && span < 2000) {
      const measured = widths[columnWidths.length];
      const cellWidth = useActualWidths && measured > 0 ? measured : base;
      columnWidths.push(cellWidth);
      width += cellWidth;
      span++;
    }
    return {name, need, width, span};
  });

  const toTsv = row => columns.map(({span}, i) => (row[i] ?? '') + '\t'.repeat(span - 1)).join('\t');
  $('out').value = useTsv && !names.length ? '' : [toTsv(names), ...rows.map(toTsv)].join('\r\n');
  $('stats').innerHTML = columns.map(({name, need, span, width}) =>
    `<tr><td>${esc(name)}</td><td>${need.toFixed(1)}</td><td>${span}</td><td>${width.toFixed(1)}</td></tr>`
  ).join('');

  const cols = columnWidths.map(width => `<col style="width:${width}px" width="${Math.round(width)}">`).join('');
  const head = columns.map(({name, span, width}) =>
    `<th colspan="${span}" style="width:${width}px;background:#d9e2f3;border:1px solid black;text-align:left;font-weight:${bold ? 'bold' : 'normal'}">${esc(name)}</th>`
  ).join('');
  const body = rows.map((row, rowIndex) => {
    const bottom = rowIndex === rows.length - 1 ? 'border-bottom:1px solid black;' : '';
    const cells = columns.map(({span}, i) =>
      `<td colspan="${span}" style="border-left:1px solid black;border-right:1px solid black;${bottom}white-space:pre">${esc(row[i] ?? '') || '&nbsp;'}</td>`
    );
    return `<tr>${cells.join('')}</tr>`;
  }).join('');
  const table = `<table style="border-collapse:collapse;table-layout:fixed;font-family:${esc(font)};font-size:${size}pt"><colgroup>${cols}</colgroup><tr>${head}</tr>${body}</table>`;
  html = '<html><body>' + table + '</body></html>';
  $('preview').innerHTML = names.length || !useTsv ? table : '';
}
for(let el of document.querySelectorAll('input,textarea:not([readonly]),select'))el.addEventListener('input',render);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('out').value);$('msg').textContent='TSVをコピーしました。'}catch{$('out').select();$('msg').textContent=document.execCommand('copy')?'コピーしました。':'Ctrl+Cでコピーしてください。'}};$('htmlcopy').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([$('out').value],{type:'text/plain'})})]);$('msg').textContent='HTML形式でコピーしました。Excelで貼り付けて確認してください。'}catch(e){$('msg').textContent='HTMLコピー不可: '+e.message+'。TSVコピーを使用してください。'}};$('save').onclick=()=>{let u=URL.createObjectURL(new Blob(['\ufeff',$('out').value],{type:'text/tab-separated-values;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='excel_width.tsv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();</script></html>
